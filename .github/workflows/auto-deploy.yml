name: Auto-Deploy to Dev Server

on:
  push:
    branches:
      - feature/pranjal-ui-changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ui.newrelay.com
        uses: appleboy/ssh-action@master
        with:
          host: 187.127.153.133
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/var/www/ui"
            mkdir -p $DEPLOY_DIR

            # Clone or pull latest code
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "📥 Pulling latest code..."
              cd $DEPLOY_DIR
              git pull origin feature/pranjal-ui-changes
            else
              echo "🔄 Cloning repository..."
              git clone --branch feature/pranjal-ui-changes https://github.com/auzadev/NewRelay.git $DEPLOY_DIR
            fi

            # Start services
            cd $DEPLOY_DIR
            echo "🐳 Starting Docker services..."
            docker compose down 2>/dev/null || true
            docker compose up -d --build

            # Run migrations
            echo "🗄️  Running database migrations..."
            docker compose exec -T rails bundle exec rails db:migrate

            # Done
            echo "✅ Deployment complete! Access at https://ui.newrelay.com"

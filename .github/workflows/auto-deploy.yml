name: Auto-Deploy to Dev Server

on:
  push:
    branches:
      - feature/pranjal-ui-changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev.newrelay.com
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.153.133
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            DEPLOY_DIR="/var/www/dev"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            if [ -d ".git" ]; then
              echo "📥 Fetching latest code..."
              git fetch --all || true
              git reset --hard origin/feature/pranjal-ui-changes || git pull origin feature/pranjal-ui-changes || true
            else
              echo "🔄 Cloning repository..."
              git clone -b feature/pranjal-ui-changes git@github.com:auzadev/DakshAI.git . || git clone -b feature/pranjal-ui-changes https://github.com/auzadev/DakshAI.git . || true
            fi

            echo "🐳 Starting Docker services..."
            if docker compose version &> /dev/null; then
              docker compose down || true
              docker compose up -d --build
              docker compose exec -T rails bundle exec rails db:migrate || true
            elif command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose up -d --build
              docker-compose exec -T rails bundle exec rails db:migrate || true
            fi

            echo "✅ Deployment completed for https://dev.newrelay.com"

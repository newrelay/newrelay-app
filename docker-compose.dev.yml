version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=dakshai_dev
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port

volumes:
  postgres_dev_data:
  redis_dev_data:

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_DB=dakshai_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_dev_data:/data

  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port

volumes:
  postgres_dev_data:
  redis_dev_data:

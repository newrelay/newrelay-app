<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewRelay Dashboard (Frontend Standalone)</title>
    <link rel="icon" type="image/svg+xml" href="/brand-assets/logo_thumbnail.svg" />
    <script>
      // Standalone has no server-side root redirect (Rails does this in prod).
      // The dashboard SPA has no route for "/" or "/app", so send bare entry to
      // the login page; it forwards already-authenticated users to their
      // dashboard. Real dashboard routes (/app/accounts/...) are untouched.
      (function () {
        var p = window.location.pathname;
        if (p === '/' || p === '/app' || p === '/app/') {
          window.location.replace('/app/login');
        }
      })();

      // NOTE: the fake auth cookie is injected ONLY in mock mode by
      // mockApiPlugin (vite.config.mts). In server mode (pnpm dev:server) no
      // cookie is seeded, so the app falls through to the real login page.
      window.newrelayConfig = {
        hostURL: window.location.origin,
        helpCenterURL: '',
        apiHost: '',
        signupEnabled: 'true',
        // isEnterprise gates ENTERPRISE-only nav (e.g. Companies). useConfig()
        // reads THIS key (newrelayConfig.isEnterprise), not globalConfig.
        isEnterprise: 'true',
        enabledLanguages: [
          { name: "English", iso_639_1_code: "en" }
        ],
        selectedLocale: 'en',
        commentAutomationMock: true,
      };
      window.globalConfig = {
        INSTALLATION_NAME: 'NewRelay',
        LOGO: '/brand-assets/logo.svg',
        LOGO_THUMBNAIL: '/brand-assets/logo_thumbnail.svg',
        APP_VERSION: '0.0.0-dev',
        GIT_SHA: 'dev-local',
        DISPLAY_MANIFEST: 'false',
        CREATE_NEW_ACCOUNT_FROM_DASHBOARD: 'false',
        DIRECT_UPLOADS_ENABLED: 'false',
        IS_ENTERPRISE: 'true',
        DEPLOYMENT_ENV: 'self-hosted',
      };
      window.browserConfig = {
        browser_name: 'Chrome',
      };
    </script>
  </head>
  <body class="text-slate-600">
    <div id="app"></div>
    <script type="module" src="/app/javascript/entrypoints/dashboard.js"></script>
  </body>
</html>

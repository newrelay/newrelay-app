type: object
properties:
  id:
    type: number
  access_token:
    type: string
  access_token_scopes:
    type: array
    items:
      type: string
    description: >-
      The list of MCP tool names this access token is scoped to call.
      An empty array means the token has unrestricted access to every tool.
  account_id:
    type: number
  available_name:
    type: string
  avatar_url:
    type: string
  confirmed:
    type: boolean
  display_name:
    type:
      - string
      - 'null'
  message_signature:
    type:
      - string
      - 'null'
  email:
    type: string
  hmac_identifier:
    type: string
  inviter_id:
    type:
      - number
      - 'null'
  name:
    type: string
  provider:
    type: string
  pubsub_token:
    type: string
  role:
    type: string
    enum: ['agent', 'administrator']
  ui_settings:
    type: object
  uid:
    type: string
  type:
    type:
      - string
      - 'null'
  custom_attributes:
    type: object
    description: Available for users who are created through platform APIs and has custom attributes associated.
  accounts:
    type: array
    items:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        status:
          type: string
        active_at:
          type:
            - string
            - 'null'
          format: date-time
        role:
          type: string
          enum: ['administrator', 'agent']
        permissions:
          type: array
          items:
            type: string
        availability:
          type: string
        availability_status:
          type: string
        auto_offline:
          type: boolean
        custom_role_id:
          type:
            - number
            - 'null'
        custom_role:
          type:
            - object
            - 'null'
